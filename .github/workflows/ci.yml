name: CI

# The repo is currently documentation only (no server code yet), so the
# meaningful check is linting the Markdown.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3
